name: Release native artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64-gnu
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - runner: macos-14
            target: macos-arm64
    env:
      PACKAGE_NAME: "fs"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/kelvra
          ref: main
          path: .runtime/kelvra
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PACKAGE_NAME" == "window" && "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y libsdl2-dev
          elif [[ "$PACKAGE_NAME" == "window" && "$RUNNER_OS" == "macOS" ]]; then
            brew install sdl2
          fi
      - name: Verify tag and manifest version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          test -n "$version"
          grep -Fq "## $version" CHANGELOG.md
          grep -Fq '"${{ matrix.target }}"' kelvra.toml
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
      - name: Build package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"
          cmake --build build --config Release --parallel
      - name: Build Kelvra runtime
        run: |
          cmake -S .runtime/kelvra -B .runtime/kelvra/build -DCMAKE_BUILD_TYPE=Release
          cmake --build .runtime/kelvra/build --parallel
      - name: Validate package and run tests
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/.runtime/kelvra/build/kelvra"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          stage="$RUNNER_TEMP/stage/github.com/kelvralang/$PACKAGE_NAME"
          mkdir -p "$(dirname "$stage")"
          rsync -a --exclude .git --exclude .runtime --exclude build "$GITHUB_WORKSPACE/" "$stage/"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp build/package.so "$stage/package.dylib"
          else
            cp build/package.so "$stage/package.so"
          fi
          "$runtime" validate-package "$stage"
          project="$RUNNER_TEMP/package-test"
          mkdir -p "$project"
          sed -e "s|__PACKAGE_NAME__|$PACKAGE_NAME|g" -e "s|__PACKAGE_VERSION__|$version|g" -e "s|__PACKAGE_PATH__|$stage|g" \
            "$GITHUB_WORKSPACE/.github/package-test.toml.in" > "$project/kelvra.toml"
          (
            cd "$project"
            KELVRA_CACHE_DIR="$RUNNER_TEMP/kelvra-cache" "$runtime" run "$stage/tests/main.kel"
          )
      - name: Bundle native artifact
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/${{ matrix.target }}"
          mkdir -p "$bundle"
          cp kelvra.toml package.api.kel LICENSE README.md CHANGELOG.md "$bundle/"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cp build/package.so "$bundle/package.so"
          else
            cp build/package.so "$bundle/package.dylib"
          fi
          tar -C dist -czf "$PACKAGE_NAME-${{ matrix.target }}.tar.gz" "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fs-${{ matrix.target }}
          path: fs-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
